<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" width="1280" height="940" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#444"/>
    </marker>
  </defs>
  <rect width="640" height="470" fill="#ffffff"/>
  <text x="20" y="35" font-size="18" font-weight="bold" fill="#212529">Cache-aside pattern</text>

  <rect x="20" y="190" width="110" height="50" rx="8" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/>
  <text x="75" y="220" text-anchor="middle" font-size="15" fill="#212529">Client</text>
  <line x1="130" y1="215" x2="178" y2="215" stroke="#444" stroke-width="2" marker-end="url(#a)"/>

  <rect x="180" y="190" width="120" height="50" rx="8" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="2"/>
  <text x="240" y="220" text-anchor="middle" font-size="15" fill="#212529">App server</text>
  <line x1="300" y1="215" x2="338" y2="215" stroke="#444" stroke-width="2" marker-end="url(#a)"/>

  <polygon points="430,160 520,215 430,270 340,215" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
  <text x="430" y="220" text-anchor="middle" font-size="15" fill="#212529">In Redis?</text>

  <line x1="430" y1="160" x2="430" y2="102" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
  <text x="442" y="135" font-size="14" font-weight="bold" fill="#2b8a3e">Yes (hit)</text>
  <rect x="345" y="50" width="170" height="50" rx="8" fill="#ebfbee" stroke="#2b8a3e" stroke-width="2"/>
  <text x="430" y="72" text-anchor="middle" font-size="14" fill="#212529">Return cached data</text>
  <text x="430" y="90" text-anchor="middle" font-size="13" fill="#2b8a3e">~1 ms</text>

  <line x1="430" y1="270" x2="430" y2="298" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
  <text x="442" y="290" font-size="14" font-weight="bold" fill="#c92a2a">No (miss)</text>
  <rect x="345" y="300" width="170" height="50" rx="8" fill="#f3f0ff" stroke="#7048e8" stroke-width="2"/>
  <text x="430" y="322" text-anchor="middle" font-size="14" fill="#212529">Query database</text>
  <text x="430" y="340" text-anchor="middle" font-size="13" fill="#7048e8">~50 ms or more</text>

  <line x1="430" y1="350" x2="430" y2="388" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
  <rect x="345" y="390" width="170" height="50" rx="8" fill="#fff5f5" stroke="#d82c20" stroke-width="2"/>
  <text x="430" y="412" text-anchor="middle" font-size="14" fill="#212529">Store in Redis (TTL)</text>
  <text x="430" y="430" text-anchor="middle" font-size="13" fill="#d82c20">then return data</text>
</svg>
